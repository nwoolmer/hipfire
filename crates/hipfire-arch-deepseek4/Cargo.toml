[package]
name = "hipfire-arch-deepseek4"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeepSeek V4 Flash architecture for hipfire (Hyper-Connections + compressed-KV indexer + tail-only RoPE)"

# Scaffold-stage crate. The Architecture trait impl wires up
# Config / Weights / State so the workspace builds and downstream
# weight-conversion + indexer kernels can land in subsequent PRs.
# Forward pass is intentionally not present here — see
# `docs/plans/deepseek4-bringup.md` (to be written) for the
# sequencing plan.

[dependencies]
hipfire-runtime = { path = "../hipfire-runtime" }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
